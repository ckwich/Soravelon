{% extends "website/base.html" %}

{% block content %}
<section class="account-surface" aria-labelledby="account-title">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8 col-sm-12">
      <div class="card account-card">
        <div class="card-body">
          <p class="soravelon-eyebrow">Your place in the living world</p>
          <h1 class="card-title" id="account-title">{% block account_heading %}{% endblock %}</h1>
          {% include "website/messages.html" %}
          {% block account_content %}{% endblock %}
          <div class="account-return">
            <a href="{% url 'index' %}">Return to Soravelon</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
