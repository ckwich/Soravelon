name: ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

env:
  DJANGO_SETTINGS_MODULE: server.conf.settings
  SORAVELON_ENV: production
  SECRET_KEY: ci-only-not-a-production-secret-0123456789-ABCDEFGHIJKLMNOPQRSTUVWXYZ
  ALLOWED_HOSTS: ci.soravelon.invalid
  CSRF_TRUSTED_ORIGINS: https://ci.soravelon.invalid
  SERVER_HOSTNAME: ci.soravelon.invalid
  SECURE_HSTS_SECONDS: "3600"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
  SECURE_HSTS_PRELOAD: "true"
  SSH_ENABLED: "false"
  SSL_ENABLED: "false"
  DATABASE_ENGINE: postgresql
  DATABASE_NAME: soravelon_ci
  DATABASE_USER: soravelon_ci
  DATABASE_PASSWORD: soravelon_ci_password
  DATABASE_HOST: 127.0.0.1
  DATABASE_PORT: "5432"

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soravelon_ci
          POSTGRES_USER: soravelon_ci
          POSTGRES_PASSWORD: soravelon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soravelon_ci -d soravelon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit Python security
        run: |
          python -m pip install bandit==1.8.6 pip-audit==2.10.0
          python -m bandit -r . -ll -ii -x .git
          python -m pip_audit --ignore-vuln PYSEC-2026-160 --strict -r requirements.txt

      - name: Run release preflight
        run: python scripts/verify_release.py preflight

  canonical-tests:
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: soravelon_ci
          POSTGRES_USER: soravelon_ci
          POSTGRES_PASSWORD: soravelon_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U soravelon_ci -d soravelon_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run canonical test shard
        run: python scripts/verify_release.py full --shard ${{ matrix.shard }}/4
